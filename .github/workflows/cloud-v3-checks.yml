name: Cloud V3 Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      REDISMS_DISABLE_POSTINSTALL: "1"
      REDISMS_SYSTEM_BINARY: /usr/bin/redis-server
    defaults:
      run:
        working-directory: ./cloud-v3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: cloud-v3/package-lock.json
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y redis-server
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: python3 -m pip install requests==2.34.2 sentry-sdk==1.45.1
      - run: python3 -m unittest discover -s ../agent -v
      - run: npx playwright install --with-deps chromium
      - id: e2e
        run: npm run e2e
        env:
          E2E_OPENAI_API_KEY: ${{ secrets.E2E_OPENAI_API_KEY }}
      - name: Retain failed browser test diagnostics
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-failures
          path: cloud-v3/test-results/
          if-no-files-found: error

  container-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build production container
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: docker build --build-arg SOURCE_SHA="$SOURCE_SHA" --tag gate-controller-smoke ./cloud-v3
      - name: Verify production container startup
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cleanup() {
            docker logs gate-controller-smoke
            docker rm --force gate-controller-smoke
          }
          trap cleanup EXIT
          docker run --detach --name gate-controller-smoke \
            --publish 127.0.0.1:3100:3000 \
            --env 'INITIAL_ADMIN_CREDENTIALS={"username":"smoke-test","password":"isolated-container-test"}' \
            --env AGENT_TOKEN=isolated-container-test \
            gate-controller-smoke
          ready=false
          for attempt in {1..30}; do
            if response="$(curl --fail --silent --max-time 3 http://127.0.0.1:3100/api/version)" &&
              jq -e --arg sha "$SOURCE_SHA" '.version == $sha' <<<"$response"; then
              ready=true
              break
            fi
            test "$(docker inspect --format '{{.State.Running}}' gate-controller-smoke)" = true
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:3100/login >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/api/gate)" = 401
