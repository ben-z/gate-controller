name: Publish and deploy Cloud V3

on:
  workflow_run:
    workflows:
      - Cloud V3 Checks
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cloud-v3-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ github.repository }}/cloud-v3
  IMAGE_REGISTRY: ghcr.io

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        env:
          AUTOMATIC_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" && "$GITHUB_REF" != refs/heads/rollback/* ]]; then
              echo "Manual deployments must use master or a rollback/* branch." >&2
              exit 1
            fi
            SOURCE_SHA="$DISPATCH_SHA"
          else
            SOURCE_SHA="$AUTOMATIC_SHA"
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $SOURCE_SHA" >&2
            exit 1
          fi

          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779 # v3.3.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.11.1
      - uses: docker/build-push-action@91df6b874e498451163feb47610c87c4a218c1ee # v6.18.0
        with:
          build-args: SOURCE_SHA=${{ needs.prepare.outputs.sha }}
          context: cloud-v3/
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.sha }}-amd64

  build-arm64:
    needs: prepare
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779 # v3.3.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.11.1
      - uses: docker/build-push-action@91df6b874e498451163feb47610c87c4a218c1ee # v6.18.0
        with:
          build-args: SOURCE_SHA=${{ needs.prepare.outputs.sha }}
          context: cloud-v3/
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.sha }}-arm64

  create-multi-arch-manifest:
    needs:
      - prepare
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@40891eba8c2bcd1309b07ba8b11232f313e86779 # v3.3.0
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.11.1
      - id: image
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          image="$IMAGE_REGISTRY/$IMAGE_NAME:sha-$SOURCE_SHA"
          docker buildx imagetools create \
            --tag "$image" \
            "$image-amd64" \
            "$image-arm64"
          docker buildx imagetools inspect "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | jq -er .)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid published image digest: $digest" >&2
            exit 1
          fi
          echo "reference=$IMAGE_REGISTRY/$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs:
      - prepare
      - create-multi-arch-manifest
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.34.8
      - uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 # v1.2
        with:
          kubelogin-version: v0.2.19
      - uses: azure/aks-set-context@c7eb093e5a5d47caa333f64974d5fd1cd4bf069d # v4.0.3
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AZURE_AKS_CLUSTER_NAME }}
          admin: false
          use-kubelogin: true
      - env:
          IMAGE: ${{ needs.create-multi-arch-manifest.outputs.image }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          GATE_CONTROLLER_KEY_VAULT_NAME: ${{ vars.GATE_CONTROLLER_KEY_VAULT_NAME }}
          GATE_CONTROLLER_SECRET_IDENTITY_CLIENT_ID: ${{ vars.GATE_CONTROLLER_SECRET_IDENTITY_CLIENT_ID }}
          GATE_CONTROLLER_URL: ${{ vars.GATE_CONTROLLER_URL }}
        run: ./deploy/deploy.sh
