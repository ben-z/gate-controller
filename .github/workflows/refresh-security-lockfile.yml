name: Refresh security lockfile
on:
  push:
    branches:
      - fix/cloud-v3-security-dependencies
    paths:
      - .github/workflows/refresh-security-lockfile.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/cloud-v3-security-dependencies
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 22.11.0
      - name: Resolve patched Next.js dependencies
        working-directory: cloud-v3
        run: npm install --package-lock-only --ignore-scripts --save-exact next@15.5.28 eslint-config-next@15.5.28
      - name: Commit generated package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-v3/package.json cloud-v3/package-lock.json
          git commit -m "Resolve Next.js 15.5.28 security patches"
          git push origin HEAD:fix/cloud-v3-security-dependencies
